name: Excel import safety checks

on:
  push:
    branches:
      - feature/excel-column-mapping
  pull_request:

jobs:
  excel-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, zip, xml, xmlreader, xmlwriter, simplexml
          coverage: none
      - name: PHP syntax checks
        run: |
          find backend/app backend/bootstrap -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Excel import validation tests
        run: php tests/excel_import_validation.php
