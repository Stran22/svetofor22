name: Android build and Gradle Wrapper
on:
  push:
    branches:
      - feature/excel-column-mapping
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-34" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore Gradle Wrapper binary
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Commit missing wrapper JAR
        run: |
          if ! git ls-files --error-unmatch android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            git add -f android/gradle/wrapper/gradle-wrapper.jar
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore Gradle Wrapper JAR'
            git push origin HEAD:feature/excel-column-mapping
          fi
      - name: Restore Firebase config from Actions secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing Actions secret GOOGLE_SERVICES_JSON_BASE64. Encode android/app/google-services.json as Base64 and add it to repository Actions secrets."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          with open("android/app/google-services.json", encoding="utf-8") as f:
              config = json.load(f)
          clients = config.get("client", [])
          if not any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "ru.svet22.app" for c in clients):
              raise SystemExit("Firebase config has no client for ru.svet22.app")
          print("Firebase configuration restored for ru.svet22.app")
          PY
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svet22-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
