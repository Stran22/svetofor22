name: Android build and Gradle Wrapper
on:
  push:
    branches:
      - feature/excel-column-mapping
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore Gradle Wrapper binary
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Commit missing wrapper JAR
        run: |
          if ! git ls-files --error-unmatch android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            git add -f android/gradle/wrapper/gradle-wrapper.jar
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore Gradle Wrapper JAR'
            git push origin HEAD:feature/excel-column-mapping
          fi
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svet22-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
