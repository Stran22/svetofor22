name: PHP checks
on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: pdo_mysql, mbstring, fileinfo, zip, xml, curl
          coverage: none
      - name: Validate Composer
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction
      - name: PHP syntax checks
        run: find app public_html bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: composer test
